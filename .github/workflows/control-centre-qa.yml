name: Control Centre QA checks
on:
  push:
    branches: ["integration/**"]
  pull_request:
    branches: [main]
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check inline Control Centre JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html=Path("familyroy-control-centre-qa/index.html").read_text()
          blocks=re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>",html,re.S|re.I)
          Path("/tmp/control-centre-inline.js").write_text("\n".join(blocks))
          PY
          node --check /tmp/control-centre-inline.js
      - name: Control Centre functional regression tests
        run: node tests/control-centre-regressions.cjs
      - name: Rewards Radar expiry, branch, and preservation regression suite
        run: node tests/rewards-radar.cjs
      - name: Test private Drive transfer and background Gmail worker contracts
        run: node tests/control-centre-cloud-and-worker.cjs
      - name: Syntax-check cloud and worker modules
        run: |
          node --check familyroy-control-centre-qa/cloud-sync.js
          node --check services/control-centre/gmail-worker.cjs
      - name: Authenticated private-backend and adversarial concurrency tests
        run: node tests/control-centre-private-backend.cjs
      - name: Syntax-check staged backend modules
        run: |
          for file in services/control-centre/*.cjs; do node --check "$file"; done
      - name: Test authenticated frontend and conflict decisions
        run: node tests/control-centre-authenticated-client.cjs
      - name: Test fully staged Gmail queue to Review integration
        run: node tests/control-centre-gmail-end-to-end.cjs
      - name: Syntax-check staged browser and review modules
        run: |
          node --check familyroy-control-centre-qa/backend-config.js
          node --check familyroy-control-centre-qa/authenticated-sync.js
          node --check familyroy-control-centre-qa/backend-sync-ui.js
          node --check services/control-centre/gmail-review.cjs
      - name: Verify privacy and release preflight is explicitly blocked
        run: |
          node --check services/control-centre/ops/preflight.cjs
          node services/control-centre/ops/preflight.cjs --ci
          node tests/control-centre-release-gates.cjs
      - name: Exercise mobile conflict choices in actual Chromium
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit puppeteer-core@24.24.1
          node tests/control-centre-conflict-ui-browser.cjs
      - name: Render QA in Chrome at phone and desktop widths
        run: node tests/control-centre-browser-smoke.cjs
      - name: Smoke-test Rewards Radar in Chromium without deploying
        run: node tests/rewards-radar-browser.cjs
      - name: Check FamilyRoy browser credential boundary
        run: |
          ! grep -q "FAMILYROY_INTAKE_TOKEN" familyroy-control-centre-qa/index.html
          ! grep -q "Authorization:'Bearer" familyroy-control-centre-qa/index.html
          grep -q "Authorization:'Handoff '" familyroy-control-centre-qa/index.html
          grep -q "history.replaceState" familyroy-control-centre-qa/index.html
          grep -q "familyroy-review:" familyroy-control-centre-qa/index.html

  real-postgres-integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: control_centre_ci
          POSTGRES_PASSWORD: test-only-secret
          POSTGRES_DB: control_centre_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U control_centre_ci -d control_centre_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PG_TEST_URL: postgresql://control_centre_ci:test-only-secret@127.0.0.1:5432/control_centre_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated PostgreSQL driver for CI only
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit pg@8.13.1
      - name: Execute actual private API over loopback HTTP and PostgreSQL
        run: node tests/control-centre-http-postgres.cjs
      - name: Validate forced RLS and Gmail offline OAuth over real local HTTP
        run: node tests/control-centre-tenant-rls-oauth-http.cjs
