name: FamilyRoy Core QA
on:
  push:
    branches: [familyroy-operational-core-v1]
    paths:
      - 'familyroy-control-centre/**'
      - '.github/workflows/familyroy-shopping-qa.yml'
  workflow_dispatch:
jobs:
  syntax-and-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check JavaScript syntax
        run: |
          node --check familyroy-control-centre/pnp-adapter.js
          node --check familyroy-control-centre/scripts/refresh-prices.mjs
      - name: Check inline Control Centre script syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('familyroy-control-centre/index.html').read_text()
          blocks=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',s,re.I)
          inline=[b for b in blocks if b.strip()]
          Path('/tmp/familyroy-inline.js').write_text('\n'.join(inline))
          PY
          node --check /tmp/familyroy-inline.js
      - name: Live retailer worker smoke test
        run: |
          node familyroy-control-centre/scripts/refresh-prices.mjs
          node - <<'NODE'
          const f=require('./familyroy-control-centre/data/price-feed.json');
          if(!f.generatedAt) throw new Error('feed timestamp missing');
          if(!f.retailers || !f.retailers.picknpay || !f.retailers.woolworths || !f.retailers.checkers) throw new Error('retailer health missing');
          if(!Array.isArray(f.observations)) throw new Error('observations missing');
          if(f.observations.some(o=>!Number.isFinite(Number(o.price))||Number(o.price)<=0)) throw new Error('invalid emitted price');
          if(f.observations.some(o=>!o.source||!o.confidence||!o.runId)) throw new Error('observation provenance missing');
          if(f.observations.some(o=>(o.validFrom&&!/^\\d{4}-\\d{2}-\\d{2}$/.test(o.validFrom))||(o.validTo&&!/^\\d{4}-\\d{2}-\\d{2}$/.test(o.validTo)))) throw new Error('promotion validity is not ISO');
          const keys=f.observations.map(o=>[o.retailer,o.conceptId,o.url||o.sku||o.barcode,String(o.checkedAt||'').slice(0,10)].join('|'));
          if(new Set(keys).size!==keys.length) throw new Error('duplicate same-day observations');
          console.log(JSON.stringify({status:f.status,observations:f.observations.length,retailers:f.retailers},null,2));
          NODE
      - name: Basket safety contract
        run: |
          node - <<'NODE'
          const s=require('fs').readFileSync('familyroy-control-centre/index.html','utf8');
          const must=[
            "o.retailer===retailer&&offerIsUsableNow(o)",
            "if(p.mixAndMatch)return null",
            "promotionGroupId",
            "basket assignment is an approximation",
            "routeRank-b.routeRank",
            "Don’t buy again",
            "Fresh basket coverage"
          ];
          for(const x of must)if(!s.includes(x))throw new Error('basket safety contract missing: '+x);
          console.log('Basket safety contract passed');
          NODE
      - name: School Readiness safety contract
        run: |
          node - <<'NODE'
          const s=require('fs').readFileSync('familyroy-control-centre/index.html','utf8');
          const must=[
            'function schoolDateFromText',
            'function readinessBucket',
            'function schoolDueLabel',
            "red roots|grade\\s*r",
            'completely voluntary|entirely voluntary',
            "actionIsToday(t)&&!['Waiting','Done'].includes(t.state)",
            'new Date(Number(full.internalDate)||Date.now())',
            'Open source email ↗'
          ];
          for(const x of must)if(!s.includes(x))throw new Error('school readiness contract missing: '+x);
          console.log('School Readiness safety contract passed');
          NODE
      - name: School notice parser smoke test
        run: |
          node - <<'NODE'
          const html=require('fs').readFileSync('familyroy-control-centre/index.html','utf8');
          const detect=html.slice(html.indexOf('function detectChild'),html.indexOf('function emailHeader'));
          const parser=html.slice(html.indexOf('function schoolDateFromText'),html.indexOf('function parsePasted'));
          function actionDueRank(t){if(!t.due)return 3;let d=new Date(t.due+'T23:59:59'),now=new Date('2026-09-29T12:00:00');let today=new Date(now.getFullYear(),now.getMonth(),now.getDate()),td=new Date(d.getFullYear(),d.getMonth(),d.getDate());let days=Math.round((td-today)/86400000);return days<0?0:days===0?1:days===1?2:3}
          eval(detect+'\n'+parser);
          let raffle=parseNotice('Dear Red Roots Parents\nFriday 23rd October is the closing date for raffle money and forms to be handed in.\nThe raffle is completely voluntary.','End of term · communications@pnps.co.za','r1',new Date('2026-09-23T08:06:00'));
          if(raffle.length!==1||raffle[0].child!=='Alexander'||raffle[0].due!=='2026-10-23')throw new Error('Red Roots raffle parsing failed: '+JSON.stringify(raffle));
          let sna=parseNotice('Please can I ask that he packs it in so not as to forget it.\nIt must be returned on Wednesday.','SNA Parent signature · kwakwadimaditsi@pnps.co.za','s1',new Date('2026-10-05T15:07:00'));
          if(!sna.some(x=>x.child==='Harrison'&&x.due==='2026-10-07'&&x.morning))throw new Error('PNPS return parsing failed: '+JSON.stringify(sna));
          let old=parseNotice('Please return the signed form on Friday 4 September.','School email · @pnps.co.za','o1',new Date('2026-09-01T08:00:00'));
          if(old.length)throw new Error('expired ordinary school action leaked into current queue');
          console.log('School notice parser smoke tests passed');
          NODE
      - name: Promotion contract smoke test
        run: |
          node - <<'NODE'
          global.window={};
          require('./familyroy-control-centre/pnp-adapter.js');
          const A=window.FamilyRoyPnP;
          const cases=[
            ['ANY 2 FOR R60','bundle-price',2],
            ['BUY ANY 2 & SAVE 20%','mix-percent',2],
            ['BUY 3, PAY FOR 2','buy-n-pay-m',3],
            ['BUY 2, SAVE R10','quantity-save',2],
            ['BUY ANY 2 & SAVE R10','mix-save',2]
          ];
          for(const [label,kind,q] of cases){
            const p=A.promotion({promotion:label,promotionGroupId:label.includes('ANY')?'test-pool':''});
            if(p.kind!==kind||p.eligibleQuantity!==q) throw new Error(label+' parsed incorrectly: '+JSON.stringify(p));
          }
          const bundle=A.promotionMath(40,A.promotion({promotion:'2 FOR R60'}),2);
          if(bundle.total!==60) throw new Error('bundle maths failed');
          const b3p2=A.promotionMath(30,A.promotion({promotion:'BUY 3, PAY FOR 2'}),3);
          if(b3p2.total!==60) throw new Error('buy 3 pay 2 maths failed');
          const card=A.promotion({promotion:'ANY 2 FOR R50 WITH CARD'});
          if(!card.memberOnly) throw new Error('loyalty marker failed');
          console.log('Promotion contract smoke tests passed');
          NODE
