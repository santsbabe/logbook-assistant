name: FamilyRoy daily price refresh

on:
  push:
    branches: [familyroy-operational-core-v1]
    paths:
      - 'familyroy-control-centre/scripts/refresh-prices.mjs'
      - 'familyroy-control-centre/data/price-queries.json'
      - '.github/workflows/familyroy-price-refresh.yml'
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: familyroy-price-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install retailer browser fallback
        working-directory: familyroy-control-centre
        run: |
          npm install --no-audit --no-fund
          npx playwright install chromium --with-deps
      - name: Refresh retailer price feed
        env:
          FAMILYROY_BROWSER: '1'
        run: node familyroy-control-centre/scripts/refresh-prices.mjs
      - name: Commit changed feed
        run: |
          git config user.name "familyroy-price-bot"
          git config user.email "actions@users.noreply.github.com"
          git add familyroy-control-centre/data/price-feed.json
          git diff --cached --quiet || git commit -m "Refresh FamilyRoy price feed"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin familyroy-operational-core-v1
            if git push origin HEAD:familyroy-operational-core-v1; then exit 0; fi
            echo "Concurrent branch update; retrying push ($attempt/5)"
            sleep $((attempt * 2))
          done
          echo "Could not publish feed after 5 concurrency retries" >&2
          exit 1
